name: Publish meteo-render packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        default: all
        type: choice
        options:
          - all
          - core
          - rendering
          - micaps
          - satellite
          - upper-air
          - raster
          - wind
          - radar
          - volume
          - image
          - leaflet
          - mars3d

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Validate release contents
        run: npm run check
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          RELEASE_PACKAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.package || 'all' }}

      - name: Publish packages in dependency order
        run: npm run publish:packages
        env:
          RELEASE_PACKAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.package || 'all' }}
